# The generation sweep: one request, four arms.
#
# The question this answers: what does raising effort, or moving to Opus, actually buy on recipe
# generation — and what does it cost. This sweep is what moved generation from Sonnet 5.5 to
# Opus 5.5 at `medium` (2026-10-12), so that arm is now the shipped one.
#
# Each provider is the REAL generate-meal path with its model and effort injected; see
# providers/generate-meal.ts for why this is a custom provider rather than promptfoo's built-in
# anthropic one.
description: CookingOS — recipe generation across models and effort

# The provider takes the request text and builds the real prompt around it, so the "prompt" here
# is just the cook's own words.
prompts:
  - '{{request}}'

# Providers use promptfoo's nested form (`- file://...: {label, config}`) rather than
# `- id: file://...`. That is not cosmetic: with the flat `id:` form, `--filter-providers` matches
# nothing for a file:// provider, so there is no way to re-run a single arm. Verified against
# promptfoo 0.120.19 — if you upgrade, re-check it before changing this back.
providers:
  - file://./providers/generate-meal.ts:
      label: sonnet-5-5/medium
      config:
        model: claude-sonnet-5-5
        effort: medium

  - file://./providers/generate-meal.ts:
      label: sonnet-5-5/high
      config:
        model: claude-sonnet-5-5
        effort: high

  - file://./providers/generate-meal.ts:
      label: opus-5-5/medium (shipped)
      config:
        model: claude-opus-5-5
        effort: medium

  - file://./providers/generate-meal.ts:
      label: opus-5-5/high
      config:
        model: claude-opus-5-5
        effort: high

defaultTest:
  assert:
    - type: javascript
      value: file://./asserts/meal.ts

tests: file://./cases/generate-meal.yaml
